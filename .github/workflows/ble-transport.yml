name: BLE transport validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # GOVERSION
      - name: Race detector
        run: go test -race ./...

  native-adapters:
    name: Native BLE adapter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # GOVERSION
      - name: Compile native helper
        run: go run ./internal/buildhelper -out dist
      - name: Build standalone application and verify embedded helper startup
        run: go run ./internal/buildstandalone
      - name: Test Windows identity long reads
        if: runner.os == 'Windows'
        run: dotnet run --project internal/ble/nativetests/IdentityRead.Tests.csproj
      - name: Test Go integration
        env:
          BTFLING_TEST_NATIVE_BUILD: '1'
        run: go test ./...
